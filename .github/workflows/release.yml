name: Build OpenWrt APK

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "htdocs/**"
      - "root/**"
      - "ucode/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build luci-theme-minimal for OpenWrt 25.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v6

      - name: Build package
        id: build
        uses: eamonxg/build-luci-package@v2
        with:
          sdk: "25.12.5"
          packages: '[{"pkg":"luci-theme-minimal","path":"."}]'

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: luci-theme-minimal-${{ steps.build.outputs.pkg_type }}
          path: out/*.[ai]pk
          if-no-files-found: error
