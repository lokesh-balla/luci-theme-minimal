name: Build and Release OpenWrt Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0 or v1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt 25+ / SNAPSHOT (APK format via apk mkpkg)
          - name: openwrt-snapshot-apk
            arch: x86_64
          # OpenWrt 23.05 (IPK format via opkg-build)
          - name: openwrt-23.05-ipk
            arch: x86_64-23.05

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Package Version from Tag or Input
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
            VERSION="${TAG#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi

          if [ -n "$VERSION" ] && [[ "$VERSION" =~ ^[0-9] ]]; then
            echo "Setting package version in Makefile to: ${VERSION}"
            sed -i.bak -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" Makefile && rm -f Makefile.bak
          else
            echo "Using default PKG_VERSION defined in Makefile"
          fi
          grep "^PKG_VERSION" Makefile

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: luci-theme-minimal
          PACKAGES: luci-theme-minimal
          INDEX: 1
          V: s

      - name: Collect built packages
        run: |
          mkdir -p dist/
          find bin/packages/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec cp -v {} dist/ \;
          echo "Generated packages:"
          ls -lh dist/
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No .apk or .ipk packages were generated!"
            exit 1
          fi

      - name: Upload artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
